# Standard object: LicenceType, a kind of licence the platform sells (ADR-0059).
# Records belong to the licensing part of the platform (managedBy); the platform defines them, an organization only
# holds licences of these types. They are the same for every organization.
# How to change this file: docs/metadata-guide.md.
apiName: LicenceType
label: Licence type
pluralLabel: Licence types
description: A kind of licence the platform sells, for example the licence of an administrator or of a user.
managedBy: licensing
extensible: false
fields:
  - apiName: key
    label: Key
    description: The permanent short name of the licence type, used by code and integrations.
    type: TEXT
    required: true
    unique: true
    settings: { maxLength: 40 }

  - apiName: name
    label: Licence type name
    type: TEXT
    required: true
    settings: { maxLength: 80 }

  - apiName: kind
    label: Kind
    description: A seat licence is what a profile needs; an add-on licence is sold with an access policy.
    type: PICKLIST
    required: true
    settings:
      values:
        - { value: Seat, label: Seat }
        - { value: AddOn, label: Add-on }
