# Developer machine. Start with:  --spring.profiles.active=local   (see README.md)
# The database settings use the variable names of infra/local/.env. The file is read directly when it exists
# (the application is started from the repository root or from platform-app), and real environment variables
# win over it. Migrations run as the owner (the local database user); the application runs as its own role, the one
# manual migration M001 creates (infra/local/init-app-role.ps1 runs it and sets the password from the same file).
spring:
  config:
    import:
      - optional:file:./infra/local/.env[.properties]
      - optional:file:../infra/local/.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:platform}
    username: ${APP_DB_USER:platform_app}
    password: ${APP_DB_PASSWORD}
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  mail:
    # The mail catcher of infra/local: it accepts every message without login or encryption and shows it at
    # http://localhost:8025.
    host: localhost
    port: ${MAIL_SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
  flyway:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:platform}
    user: ${POSTGRES_USER:platform}
    password: ${POSTGRES_PASSWORD}

management:
  metrics:
    tags:
      environment: local
  otlp:
    tracing:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:${TRACING_COLLECTOR_PORT:4318}/v1/traces

logging:
  structured:
    format:
      # Readable lines for a human at a terminal; set to ecs to see exactly what a deployment would log.
      console: ${PLATFORM_LOG_FORMAT:}
  pattern:
    correlation: "[trace=%X{traceId:-} request=%X{requestId:-} tenant=%X{tenantId:-}] "

platform:
  tenancy:
    # Browsers resolve every *.localhost name to this machine: open http://tenant-a.localhost:3000
    base-domain: localhost
    # The development proxy of the web app rewrites the Host header and passes the original in X-Forwarded-Host.
    trust-forwarded-host: true
  security:
    # Objects do not exist before Sprint 10: two sample objects let the permission editors be tried by hand (ADR-0049).
    sample-objects:
      - key: object-a
        label: Object A
        fields:
          - { key: field-a, label: Field A }
          - { key: field-b, label: Field B }
          - { key: field-c, label: Field C }
      - key: object-b
        label: Object B
        fields:
          - { key: field-a, label: Field A }
  notification:
    sender-address: no-reply@example.test
    # The web app's development server.
    public-base-url: http://localhost:3000
  identity:
    # A developer machine uses plain HTTP, so cookies cannot be Secure; the signing key lives only in memory; the
    # development proxy passes the caller's address in X-Forwarded-For.
    trust-forwarded-for: true
    cookies:
      secure: false
    signing:
      ephemeral: true
