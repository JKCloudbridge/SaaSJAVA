# Base configuration shared by every environment (ADR-0009, ADR-0011, ADR-0012).
# It contains no secrets and no host names. Anything that differs per environment comes from environment
# variables; a variable without a default is mandatory, so a missing one stops the start-up with a clear message
# instead of silently connecting somewhere unintended. Profiles: local (developer machine), test (automated tests),
# prod (every deployed environment; the container image runs it).
spring:
  application:
    name: platform
  jackson:
    # A null field is left out of the JSON; the generated client types such fields as optional.
    default-property-inclusion: non_null
  datasource:
    # Runtime connection: the application role. It must never own tables or run schema changes (ADR-0009).
    url: ${PLATFORM_DB_URL}
    username: ${PLATFORM_DB_APP_USER}
    password: ${PLATFORM_DB_APP_PASSWORD}
    hikari:
      pool-name: platform
      maximum-pool-size: ${PLATFORM_DB_POOL_SIZE:10}
      # Fail fast: a readiness probe must not wait half a minute for a database that is not there.
      connection-timeout: 5000
      data-source-properties:
        ApplicationName: platform
  flyway:
    # Migration connection: the owner role, used only while migrating. Separate credentials so the runtime role
    # can stay without schema privileges (ADR-0009). Migrations are forward-only: there is nothing to undo or clean.
    url: ${PLATFORM_DB_URL}
    user: ${PLATFORM_DB_OWNER_USER}
    password: ${PLATFORM_DB_OWNER_PASSWORD}
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    baseline-on-migrate: false
    clean-disabled: true
    placeholder-replacement: false
  data:
    redis:
      # Redis holds the rate limits that must be shared by every instance (ADR-0021). A short timeout, because a slow
      # Redis must never slow a sign-in down: after one failure the instance counts for itself for a few seconds.
      host: ${PLATFORM_REDIS_HOST}
      port: ${PLATFORM_REDIS_PORT:6379}
      password: ${PLATFORM_REDIS_PASSWORD:}
      timeout: 250ms
      connect-timeout: 250ms
  mail:
    # The SMTP server of the notification module (ADR-0024). A deployment names its own; a developer machine uses the
    # mail catcher (profile local). Timeouts are short: a slow server must never hold a relay thread for long.
    host: ${PLATFORM_SMTP_HOST}
    port: ${PLATFORM_SMTP_PORT:587}
    username: ${PLATFORM_SMTP_USER:}
    password: ${PLATFORM_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${PLATFORM_SMTP_AUTH:true}
          starttls:
            enable: true
            # No unencrypted submission outside a developer machine.
            required: ${PLATFORM_SMTP_STARTTLS_REQUIRED:true}
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PLATFORM_HTTP_PORT:8080}
  shutdown: graceful
  error:
    # Error bodies come from the platform's own error model, never from the container's defaults.
    whitelabel:
      enabled: false
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: never

management:
  server:
    # Probes and metrics are served on their own port so that routing only the API port to the outside is enough
    # to keep them private.
    port: ${PLATFORM_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${PLATFORM_ENVIRONMENT:unknown}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  otlp:
    metrics:
      export:
        # Metrics are pulled from the management port; the push exporter that comes with the tracing starter is off.
        enabled: false
    tracing:
      export:
        # Whether spans are shipped to the trace collector (PLATFORM_TRACE_EXPORT=true). Independent of the
        # propagation switch below, so a deployment without a collector still correlates logs by trace ID.
        enabled: ${PLATFORM_TRACE_EXPORT:false}
  tracing:
    sampling:
      probability: ${PLATFORM_TRACE_SAMPLING:0.1}
    export:
      # Keep this on. In Spring Boot 4.1 it also switches on W3C trace context propagation: with it off the
      # application neither continues an incoming trace nor passes one on, and the browser to API to database
      # correlation silently breaks.
      enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${PLATFORM_TRACE_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http

# One span per SQL statement and per connection checkout, so a trace reaches the database (ADR-0012).
jdbc:
  includes: connection, query
  datasource-proxy:
    # Bind values can be personal data: spans and logs show the statement with its placeholders only.
    include-parameter-values: false

logging:
  # Structured JSON on standard output is the default so a deployment that forgets its profile is still parseable.
  # Every line carries the request ID and trace ID (and the tenant ID once Sprint 2 sets it).
  structured:
    format:
      console: ecs
  level:
    root: INFO
    # The mail library prints the recipients of every message when it is switched to debug. An address is personal
    # data and never goes to a log (ADR-0012), so it stays at warnings whatever else is switched on.
    org.eclipse.angus.mail: WARN

springdoc:
  # The OpenAPI document is the contract's source of truth (ADR-0011); the interactive documentation page is not served.
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    enabled: false
  paths-to-match: /api/v1/**
  default-produces-media-type: application/json
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

platform:
  tenancy:
    # The platform domain: an organization lives at <slug>.<base-domain> (ADR-0017). No default on purpose; the local
    # and test profiles set one, every deployment must (PLATFORM_BASE_DOMAIN).
    base-domain: ${PLATFORM_BASE_DOMAIN}
    # Take the host name from X-Forwarded-Host instead of Host. Only behind a trusted proxy that overwrites the header
    # on every request; with the API reachable directly a caller could name any organization host.
    trust-forwarded-host: ${PLATFORM_TRUST_FORWARDED_HOST:false}
  outbox:
    # Every instance may run the relay; they coordinate through the database (ADR-0016).
    enabled: ${PLATFORM_OUTBOX_ENABLED:true}
  notification:
    # Every instance may run the mail relay; they coordinate through the database (ADR-0024).
    enabled: ${PLATFORM_MAIL_RELAY_ENABLED:true}
    # The address mails come from, and where the platform's pages live (links in mails point there). No defaults:
    # a deployment names its own.
    sender-address: ${PLATFORM_MAIL_SENDER}
    public-base-url: ${PLATFORM_PUBLIC_BASE_URL}
  identity:
    # Behind a trusted proxy that overwrites X-Forwarded-For (the source address of rate limits and audit records);
    # with the API reachable directly a caller could choose its own address, which is why the default is off.
    trust-forwarded-for: ${PLATFORM_TRUST_FORWARDED_FOR:false}
    # Cookies carry the Secure flag everywhere except a developer machine (profile local).
    cookies:
      secure: true
    signing:
      # The keys that sign ID tokens, newest first (ADR-0019): a deployment supplies the files; there is no default.
      # An entry without an identifier is ignored, so a deployment that forgot them gets one clear start-up message.
      keys:
        - id: ${PLATFORM_SIGNING_KEY_ID:}
          private-key-file: ${PLATFORM_SIGNING_PRIVATE_KEY_FILE:}
          public-key-file: ${PLATFORM_SIGNING_PUBLIC_KEY_FILE:}
    seed:
      password: ${LOCAL_SEED_PASSWORD:}
