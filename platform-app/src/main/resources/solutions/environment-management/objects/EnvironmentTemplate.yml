# Shipped object: EnvironmentTemplate, the header of a template of the Environment Management application (FA13B, ADR-0226).
# It plays the part "template" in the solution file, exactly as InspectionTemplate does for the Quality Management System
# application: the same fields and the same rules, in an object of its own, so the documents of the two applications are
# separate records with separate approval processes, number series, access policies and shares.
#
# The fields are a copy of those of the other application on purpose: the functions (numbering, the identity pair at the
# first approval, publishing, revisions) read these names. A test (EnvironmentParityTest) fails the build when the two
# lists of fields drift apart. The starting lists below are placeholders; the organization's administrator owns the lists
# and the pairs from then on (ADR-0182).
#
# requiresFeature: an organization without the plan feature does not have this object at all.
# retainRecords:   no record of this object is ever deleted, restored over or purged, by anyone (ADR-0174 section 7).
# extensible:      an organization cannot add fields of its own to a shipped object.
# sharingDefault:  PRIVATE, fixed by the platform: a template is reached only by its owner (the author), the people who
#                  may view every template (the approvers) and the people it is published to (ADR-0189).
apiName: EnvironmentTemplate
label: Template
pluralLabel: Templates
description: A template of the Environment Management application. Its records are kept for good.
extensible: false
requiresFeature: environment-management
retainRecords: true
sharingDefault: PRIVATE
fields:
  - apiName: name
    label: Document name
    description: The name people read.
    type: TEXT
    required: true
    settings: { maxLength: 120 }

  - apiName: level
    label: Level
    description: The level the document belongs to. It decides which documents can be chosen. The administrator keeps the list and the pairs in Setup.
    type: PICKLIST
    organizationValues: true
    codeValues: true
    settings:
      values:
        - { value: L1, label: "Level 1" }
        - { value: L2, label: "Level 2" }

  - apiName: documentType
    label: Document type
    description: The kind of document within the level. Only the documents that go with the level can be chosen.
    type: PICKLIST
    organizationValues: true
    codeValues: true
    settings:
      values:
        - { value: DOCA, label: "Document A" }
        - { value: DOCB, label: "Document B" }
        - { value: DOCC, label: "Document C" }
        - { value: DOCD, label: "Document D" }
      dependency:
        controllingField: level
        allowed:
          L1: [DOCA, DOCB]
          L2: [DOCC, DOCD]

  - apiName: retired
    label: Obsolete
    description: Whether the template is no longer used. A retired template is kept and can still be read. Only retiring it sets this.
    type: BOOLEAN
    platformWritten: true

  - apiName: category
    label: Identification
    description: The kind of document. It decides how the number is written and which of Part A and Part B are asked for. The administrator keeps the list in Setup; each value needs a number pattern in Setup, Numbering.
    type: PICKLIST
    organizationValues: true
    codeValues: true
    settings:
      values:
        - { value: IMS, label: "IMS - Integrated Management System" }
        - { value: QSP, label: "QSP - Quality System Procedure" }
        - { value: CORPQSP, label: "CORP-QSP - Corporate Quality System Procedure" }
        - { value: ESSP, label: "ESSP - Environment Safety System Procedure" }
        - { value: CP, label: "CP - Control Plan" }
        - { value: WI, label: "WI - Work Instruction" }
        - { value: PFC, label: "PFC - Process Flow Chart" }
        - { value: FMEA, label: "FMEA - Failure Mode Effect Analysis" }
        - { value: SOP, label: "SOP - Standard Operating Procedure" }
        - { value: BP, label: "BP - Business Plan" }
        - { value: F, label: "F - Format" }
        - { value: FEHS, label: "F/EHS - Format, Environment health safety" }
        - { value: CSF, label: "CSF - Customer format" }
        - { value: PPT, label: "PPT - Process" }
        - { value: L, label: "L - List" }
        - { value: LEHS, label: "L/EHS - List, Environment health safety" }
        - { value: R, label: "R - Register" }
        - { value: REHS, label: "R/EHS - Register, Environment health safety" }
        - { value: EHSAIR, label: "EHS/AIR - Aspect identification register" }
        - { value: EHSHIR, label: "EHS/HIR - Hazard identification register" }
        - { value: EHSAID, label: "EHS/AID - Aspect identification diagram" }
        - { value: EHSHID, label: "EHS/HID - Hazard identification diagram" }
        - { value: EHSAHID, label: "EHS/AHID - Aspect hazard identification diagram" }
        - { value: PLEHS, label: "PL/EHS - Planner, Environment health safety" }
        - { value: EHSEMP, label: "EHS/EMP - Environmental management program" }
        - { value: EHSOCP, label: "EHS/OCP - Operational control procedure" }

  - apiName: partA
    label: Part A
    description: Typed freehand when the identification asks for it (for example the process name or the customer). Capital letters, digits and hyphen, up to 10. The number is made from it, so it is fixed once the template has its number.
    type: TEXT
    settings: { maxLength: 10 }

  - apiName: partB
    label: Part B
    description: Typed freehand when the identification asks for it (for example a part code or a year). Capital letters, digits and hyphen, up to 10. The number is made from it, so it is fixed once the template has its number.
    type: TEXT
    settings: { maxLength: 10 }

  - apiName: serial
    label: Serial number
    description: The first serial number of a new combination, typed once by the person who sets the identification. Digits only. When the combination already has numbers the next one is given automatically and nothing is typed. It is used when the template is saved and then cleared.
    type: TEXT
    settings: { maxLength: 12 }

  - apiName: number
    label: Document number
    description: The document number. The platform gives it when the template is approved; nobody types it.
    type: TEXT
    unique: true
    platformWritten: true
    settings: { maxLength: 40 }

  - apiName: revision
    label: Revision number
    description: The revision now in use, written with two digits (00 is the first). The platform sets it when a revision is published; nobody types it.
    type: TEXT
    platformWritten: true
    settings: { maxLength: 10 }

  - apiName: lastRevisedAt
    label: Last revised on
    description: When the revision now in use was published. The platform sets it at that moment; nobody types it.
    type: TEXT
    platformWritten: true
    settings: { maxLength: 40 }

  # MC1.1, ADR-0259: the shared template functions write this field on every template object they serve. No rule routes a
  # document of this application anywhere, so it stays empty.
  - apiName: application
    label: Application
    description: Not used by this application; the shared functions of the templates require the field. Always empty.
    type: TEXT
    platformWritten: true
    indexed: true
    settings: { maxLength: 60 }
