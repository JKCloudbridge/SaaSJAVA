# The CAPA application (Functional track FA13A, ADR-0225): announced before it is built. It has only its Home.
# It brings no objects and no access policies, so there is nothing to read or to protect. It has a plan feature of its
# own, so an organization can have it with or without any other application. A tab becomes a real page later by
# changing only this file and registering its page in the web application.
key: capa
feature: capa
label: CAPA
removalNote: >-
  Taking this feature away hides the CAPA application from the organization at once. It holds no data, so nothing is lost,
  and it comes back when the feature is given again.
order: 2
application:
  apiName: capa
  label: CAPA
  iconKey: refresh
  group: Operations
  entries:
    - type: PLATFORM
      label: Home
      pageKey: home
