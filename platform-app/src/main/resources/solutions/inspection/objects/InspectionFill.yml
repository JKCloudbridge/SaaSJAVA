# Shipped object: InspectionFill, the header of a fill-in of the Quality Management System application (FF1, ADR-0180, ADR-0192).
# A fill-in is what a person types into a template that was published to them. The header is a record so that a
# fill-in has an owner, a place in the record store's lists, shares and an approval of its own; its cells and its status
# are kept in the sheets module (table sheet_fill), pinned to the version of the template the fill-in was started on.
#
# Every field is one only the platform writes: a member never creates or changes a header (the Filler policy gives no
# create right and no field to edit), the platform makes it when the person starts a fill-in and follows the status
# when the review moves it. A member's right to "update" the header is only what lets them have its cells changed.
#
# requiresFeature: an organization without the plan feature does not have this object at all.
# retainRecords:   no fill-in is ever deleted, restored over or purged, by anyone (business decision 10, ADR-0174
#                  section 7).
# extensible:      an organization cannot add fields of its own to a shipped object.
# sharingDefault:  PRIVATE, fixed by the platform: a fill-in is reached only by its owner (the filler), the people who
#                  may view every fill-in and the people it is shared with. The role hierarchy adds nothing and no
#                  administrator can change it (ADR-0189).
# platformWritten: nobody writes this field through the API, a bulk change or an import; the platform does.
apiName: InspectionFill
label: Fill-in
pluralLabel: Fill-ins
description: A fill-in of a template of the Quality Management System application. Its records are kept for good.
extensible: false
requiresFeature: inspection
# The Document Management application shows the same records (FA13A, ADR-0225): the object exists when either
# application's plan feature is on, and nothing is stored twice.
alsoAvailableWith: [document-management, management-core]
retainRecords: true
sharingDefault: PRIVATE
fields:
  - apiName: name
    label: Fill-in name
    description: "The name the fill-in is shown by: that of the template when the fill-in was started."
    type: TEXT
    platformWritten: true
    settings: { maxLength: 160 }

  - apiName: templateId
    label: Template
    description: The template the fill-in was started on, as the text of its identifier. It never changes.
    type: TEXT
    platformWritten: true
    indexed: true
    settings: { maxLength: 36 }

  - apiName: status
    label: Status
    description: Draft, submitted, returned or approved. A copy that follows the fill-in; the fill-in itself decides.
    type: TEXT
    platformWritten: true
    indexed: true
    settings: { maxLength: 20 }

  # MC1.1, ADR-0259: copied from the document when the fill-in is started, so a list, a report, a dashboard and an
  # approval process (through its entry criteria) can tell which application the fill-in belongs to. Empty means
  # Document Management only. It never changes.
  - apiName: application
    label: Application
    description: The application the template belongs to, copied when the fill-in was started. Empty means Document Management only.
    type: TEXT
    platformWritten: true
    indexed: true
    settings: { maxLength: 60 }

  # MC2A, ADR-0260: the plant and the month of a monthly fill-in (an application whose file says `monthlyFillIn`). Both
  # are written once, when the plant head starts the fill-in, and never change; empty means the fill-in belongs to no
  # plant (every other application). One fill-in exists for a document, a plant and a month: the database holds that
  # (inspection_fill_period, V093), not these fields.
  - apiName: plant
    label: Plant
    description: The plant (a location) the fill-in is for. Empty for a fill-in that belongs to no plant.
    type: TEXT
    platformWritten: true
    indexed: true
    settings: { maxLength: 10 }

  - apiName: period
    label: Month
    description: The month the fill-in is for, as year and month (2026-05). Empty for a fill-in that has no month.
    type: TEXT
    platformWritten: true
    indexed: true
    settings: { maxLength: 7 }

  # MC2B, ADR-0261: the score of a fill-in whose sheet marks a score cell, and what it means. Both are written by the
  # platform each time a reviewer approves (from the cells, with the sheet's own formulas) and are never typed. The score
  # is in percent points with two decimals (90.00). The result is PASS, or ACTION_PLAN when the score is strictly below
  # the limit of the application (Setup, Application settings). Both are empty for a fill-in whose sheet marks no score.
  - apiName: score
    label: Score
    description: The percent the sheet calculated, in percent points. Empty for a fill-in that has no score.
    type: DECIMAL
    platformWritten: true
    indexed: true
    settings: { precision: 5, scale: 2 }

  - apiName: result
    label: Result
    description: Pass, or action plan needed when the score is below the limit. Empty for a fill-in that has no score.
    type: TEXT
    platformWritten: true
    indexed: true
    settings: { maxLength: 20 }

  # MC2B, ADR-0261: an Action plan is a fill-in of the Action plan document that answers one low-scoring fill-in. This
  # is the link, written once by the platform when the plant head starts it, as the text of the identifier of the
  # low-scoring fill-in. Unique: one Action plan for each low-scoring fill-in. Empty for every other fill-in.
  - apiName: parentFill
    label: Action plan for
    description: The fill-in this Action plan answers, as the text of its identifier. Empty for every other fill-in.
    type: TEXT
    unique: true
    platformWritten: true
    indexed: true
    settings: { maxLength: 36 }

  # Dashboard for Management Core (ADR-0266): two days the platform writes once, as year-month-day in UTC, from its own
  # clock. scoredOn is the day the reviewer's Submit stamped the score (the due day of an Action plan is this day plus
  # the setting actionPlanDueDays). planSentOn is the day the plant head first sent an Action plan. Both are empty for a
  # fill-in made before they existed, and never typed.
  - apiName: scoredOn
    label: Scored on
    description: The day the reviewer's Submit stamped the score, as year-month-day. Empty when not stamped.
    type: TEXT
    platformWritten: true
    settings: { maxLength: 10 }

  - apiName: planSentOn
    label: Action plan sent on
    description: The day the plant head first sent this Action plan, as year-month-day. Empty for every other fill-in.
    type: TEXT
    platformWritten: true
    settings: { maxLength: 10 }
