# Shipped object: InspectionTemplate, the header of a template of the Audit maintenance application (ADR-0175, ADR-0180,
# ADR-0181). It is a platform definition like the standard objects: the loader, the baseline test and the rule "never
# delete or rename a released definition, set retired: true" (docs/metadata-guide.md) apply to it.
#
# FA1 declared only what proves the framework: the name, and the flag that retires a template. FA2A adds, additively,
# the classification (category and sub-category, two picklists whose lists the organization owns, the second depending
# on the first) and the number (a unique text field only the platform writes; the series that fills it is declared in
# numbering.yml next to solution.yml). The next sprints add what they need: the lifecycle (FA4), the people (FA4).
#
# organizationValues: the platform ships the starting list below; the organization's administrator owns the list and
#                     the pairs from then on, and a member who may add values can add one from the form (ADR-0182).
# codeValues:         every value is a short code (letters, digits, hyphen, underscore; at most 10), because it is a part
#                     of a number; the label says more (ADR-0182, ADR-0184).
# platformWritten:    nobody writes this field through the API, a bulk change or an import; the platform's engine does
#                     (ADR-0183).
#
# The starting list is the categories of the numbering scheme of the first customer (one code each, the label says what
# it is). The sub-categories are placeholders - generic process abbreviations and customers - that every organization
# replaces with its own; a sub-category goes with the categories that list it.
#
# requiresFeature: an organization without the plan feature does not have this object at all.
# retainRecords:   no record of this object is ever deleted, restored over or purged, by anyone (ADR-0174 section 7).
# extensible:      an organization cannot add fields of its own to a shipped object.
# sharingDefault:  PRIVATE, fixed by the platform: a template is reached only by its owner (the author), the people who
#                  may view every template (the approvers) and the people it is published to. The role hierarchy adds
#                  nothing and no administrator can change it (ADR-0189).
apiName: InspectionTemplate
label: Template
pluralLabel: Templates
description: A template of the Audit maintenance application. Its records are kept for good.
extensible: false
requiresFeature: inspection
retainRecords: true
sharingDefault: PRIVATE
fields:
  - apiName: name
    label: Template name
    description: The name people read.
    type: TEXT
    required: true
    settings: { maxLength: 120 }

  - apiName: level
    label: Level
    description: The level the document belongs to. It decides which documents can be chosen. The administrator keeps the list and the pairs in Setup.
    type: PICKLIST
    organizationValues: true
    codeValues: true
    settings:
      values:
        - { value: L1, label: "Level 1" }
        - { value: L2, label: "Level 2" }

  - apiName: documentType
    label: Document
    description: The kind of document within the level. Only the documents that go with the level can be chosen.
    type: PICKLIST
    organizationValues: true
    codeValues: true
    settings:
      values:
        - { value: DOCA, label: "Document A" }
        - { value: DOCB, label: "Document B" }
        - { value: DOCC, label: "Document C" }
        - { value: DOCD, label: "Document D" }
      dependency:
        controllingField: level
        allowed:
          L1: [DOCA, DOCB]
          L2: [DOCC, DOCD]

  - apiName: retired
    label: Retired
    description: Whether the template is no longer used. A retired template is kept and can still be read. Only retiring it sets this.
    type: BOOLEAN
    platformWritten: true

  - apiName: category
    label: Identity category
    description: The kind of document. It decides how the number is written and which sub-categories go with it.
    type: PICKLIST
    organizationValues: true
    codeValues: true
    settings:
      values:
        - { value: IMS, label: "IMS - Integrated Management System" }
        - { value: QSP, label: "QSP - Quality System Procedure" }
        - { value: CORPQSP, label: "CORP-QSP - Corporate Quality System Procedure" }
        - { value: ESSP, label: "ESSP - Environment Safety System Procedure" }
        - { value: CP, label: "CP - Control Plan" }
        - { value: WI, label: "WI - Work Instruction" }
        - { value: PFC, label: "PFC - Process Flow Chart" }
        - { value: FMEA, label: "FMEA - Failure Mode Effect Analysis" }
        - { value: SOP, label: "SOP - Standard Operating Procedure" }
        - { value: BP, label: "BP - Business Plan" }
        - { value: F, label: "F - Format" }
        - { value: FEHS, label: "F/EHS - Format, Environment health safety" }
        - { value: CSF, label: "CSF - Customer format" }
        - { value: PPT, label: "PPT - Process" }
        - { value: L, label: "L - List" }
        - { value: LEHS, label: "L/EHS - List, Environment health safety" }

  - apiName: subCategory
    label: Identity sub-category
    description: The process or the customer the document is for. Only the sub-categories that go with the category can be chosen.
    type: PICKLIST
    organizationValues: true
    codeValues: true
    settings:
      values:
        - { value: PRD, label: "PRD - Production" }
        - { value: QLT, label: "QLT - Quality" }
        - { value: MNT, label: "MNT - Maintenance" }
        - { value: STR, label: "STR - Stores" }
        - { value: CORP, label: "CORP - Corporate" }
        - { value: CUSA, label: "CUSA - Customer A" }
        - { value: CUSB, label: "CUSB - Customer B" }
      dependency:
        controllingField: category
        allowed:
          IMS: []
          QSP: []
          CORPQSP: []
          ESSP: []
          BP: []
          CP: [PRD, QLT, MNT, STR]
          WI: [PRD, QLT, MNT, STR]
          PFC: [PRD, QLT, MNT, STR]
          FMEA: [PRD, QLT, MNT, STR]
          SOP: [PRD, QLT, MNT, STR]
          F: [PRD, QLT, MNT, STR]
          FEHS: [PRD, QLT, MNT, STR]
          PPT: [PRD, QLT, MNT, STR]
          L: [PRD, QLT, MNT, STR]
          LEHS: [PRD, QLT, MNT, STR]
          CSF: [CORP, CUSA, CUSB]

  - apiName: partCode
    label: Part code
    description: The code of the part the document is for. Needed for the categories whose number ends in it (control plan, process flow chart, failure mode analysis); the number is made from it, so it is fixed once the template has its number.
    type: TEXT
    settings: { maxLength: 10 }

  - apiName: planYear
    label: Plan year
    description: The four-digit year of a business plan. Needed for the category whose number ends in it; the number is made from it.
    type: TEXT
    settings: { maxLength: 4 }

  - apiName: number
    label: Number
    description: The document number. The platform gives it when the template is approved; nobody types it.
    type: TEXT
    unique: true
    platformWritten: true
    settings: { maxLength: 40 }
