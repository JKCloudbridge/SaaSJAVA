# The Audit maintenance solution (Functional track, ADR-0175, ADR-0179, ADR-0180, ADR-0181).
#
# A shipped solution is read-only data inside the platform: an organization sees it only while its plan has the feature
# and can neither change nor remove any part of it. The application below is computed for every request and written to
# no table of the organization. The access policies are made as rows in each organization that has the feature, marked as
# shipped (so an administrator can assign them but not change them), the way the system profiles are made.
#
# The rights of the policies (FA4, ADR-0189): the rights on the objects and the abilities that go with each job. Authoring
# is the ordinary right to change a template; passing the lock of an approval, publishing and retiring are abilities
# (a template is never given a delete right: its records are kept). Licence, access policy and plan feature stay three
# mechanisms: these policies are not bound to a licence, and the plan feature decides whether any of this exists.
key: inspection
feature: inspection
label: Audit maintenance
removalNote: >-
  Taking this feature away hides the Audit maintenance application and its objects from the organization at once.
  Nothing is deleted: the records, approvals in flight and access policies stay, and everything comes back when the
  feature is given again.
application:
  apiName: inspection
  label: Audit maintenance
  iconKey: clipboard
  entries:
    - type: PLATFORM
      label: Templates
      pageKey: templates
      readsObject: InspectionTemplate
    - type: OBJECT
      object: DepartmentGroup
objects:
  - InspectionTemplate
  - DepartmentGroup
# The records of these objects own a sheet: the grid of the template, kept in versions (FA3, ADR-0186).
sheetOwners:
  - InspectionTemplate
accessPolicies:
  - key: author
    name: Author
    description: Writes templates and sends them for approval. Comes with the Audit maintenance application and cannot be changed.
    objects:
      InspectionTemplate: [create, read, update]
    fields:
      InspectionTemplate:
        edit: [name, category, subCategory, partCode, planYear]
        read: [number, retired, createdAt, updatedAt, ownerId, createdById, updatedById]
  - key: approver
    name: Approver
    description: Sees every template, changes one that is in review, publishes and retires. Comes with the Audit maintenance application and cannot be changed.
    objects:
      InspectionTemplate: [read, update, view-all, modify-all]
    abilities:
      - approvals.override-lock
      - sheets.publish
      - sheets.retire
    fields:
      InspectionTemplate:
        edit: [name, category, subCategory, partCode, planYear]
        read: [number, retired, createdAt, updatedAt, ownerId, createdById, updatedById]
  - key: reader
    name: Reader
    description: Reads the templates published to them. Comes with the Audit maintenance application and cannot be changed.
    objects:
      InspectionTemplate: [read]
    fields:
      InspectionTemplate:
        read: [name, number, category, subCategory, partCode, planYear, retired, createdAt, updatedAt, ownerId,
                createdById, updatedById]
  - key: filler
    name: Filler
    description: Fills in published templates. Comes with the Audit maintenance application and cannot be changed.
    objects:
      InspectionTemplate: [read]
    fields:
      InspectionTemplate:
        read: [name, number, category, subCategory, partCode, planYear, retired, createdAt, updatedAt, ownerId,
                createdById, updatedById]
  - key: departments
    name: Department setup
    description: Says which group of people belongs to which department of which location. Comes with the Audit maintenance application and cannot be changed.
    objects:
      DepartmentGroup: [create, read, update, delete]
    fields:
      DepartmentGroup:
        edit: [name, location, department, groupId]
        read: [createdAt, updatedAt, ownerId, createdById, updatedById]
