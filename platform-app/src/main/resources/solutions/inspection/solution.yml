# The Audit maintenance solution (Functional track, ADR-0175, ADR-0179, ADR-0180, ADR-0181).
#
# A shipped solution is read-only data inside the platform: an organization sees it only while its plan has the feature
# and can neither change nor remove any part of it. The application below is computed for every request and written to
# no table of the organization. The access policies are made as rows in each organization that has the feature, marked as
# shipped (so an administrator can assign them but not change them), the way the system profiles are made.
#
# The rights of the policies (FA4, ADR-0189): the rights on the objects and the abilities that go with each job. Authoring
# is the ordinary right to change a template; passing the lock of an approval is an ability of the Approver, and publishing
# and retiring are abilities of the Publisher, a policy apart so that an administrator decides which group has the last word
# (a template is never given a delete right: its records are kept). Licence, access policy and plan feature stay three
# mechanisms: these policies are not bound to a licence, and the plan feature decides whether any of this exists.
key: inspection
feature: inspection
label: Audit maintenance
removalNote: >-
  Taking this feature away hides the Audit maintenance application and its objects from the organization at once.
  Nothing is deleted: the records, approvals in flight and access policies stay, and everything comes back when the
  feature is given again.
application:
  apiName: inspection
  label: Audit maintenance
  iconKey: clipboard
  entries:
    - type: PLATFORM
      label: Templates
      pageKey: templates
      readsObject: InspectionTemplate
    - type: PLATFORM
      label: Fill-ins
      pageKey: fill-ins
      readsObject: InspectionFill
    - type: PLATFORM
      label: Change requests
      pageKey: change-requests
      readsObject: InspectionChangeRequest
    - type: PLATFORM
      label: Report
      pageKey: fill-in-report
      readsObject: InspectionFill
    - type: OBJECT
      object: DepartmentGroup
objects:
  - InspectionTemplate
  - InspectionFill
  - InspectionChangeRequest
  - DepartmentGroup
# The records of these objects own a sheet: the grid of the template, kept in versions (FA3, ADR-0186).
sheetOwners:
  - InspectionTemplate
accessPolicies:
  - key: author
    name: Author
    description: Writes templates and sends them for approval. Comes with the Audit maintenance application and cannot be changed.
    objects:
      InspectionTemplate: [create, read, update]
      InspectionChangeRequest: [read]
    fields:
      InspectionTemplate:
        edit: [name, level, documentType]
        read: [id, category, subCategory, partCode, planYear, number, retired, revision, lastRevisedAt, createdAt, updatedAt, ownerId,
                createdById, updatedById]
      InspectionChangeRequest:
        read: [id, name, templateId, status, createdAt, updatedAt, ownerId, createdById, updatedById]
  - key: approver
    name: Approver
    description: Sees every template and change request, and changes a template that is in review. Does not publish or retire; that is the Publisher policy. Comes with the Audit maintenance application and cannot be changed.
    objects:
      InspectionTemplate: [read, update, view-all, modify-all]
      InspectionFill: [read, update, view-all, modify-all]
      InspectionChangeRequest: [read, update, view-all, modify-all]
    abilities:
      - approvals.override-lock
      - field-values.add
    fields:
      InspectionTemplate:
        edit: [name, level, documentType, category, subCategory, partCode, planYear]
        read: [id, number, retired, revision, lastRevisedAt, createdAt, updatedAt, ownerId, createdById, updatedById]
      InspectionFill:
        read: [id, name, templateId, status, createdAt, updatedAt, ownerId, createdById, updatedById]
      InspectionChangeRequest:
        read: [id, name, templateId, status, createdAt, updatedAt, ownerId, createdById, updatedById]
  - key: publisher
    name: Publisher
    description: Publishes an approved template to departments, takes it back and retires it. Give it to the group that has the last word, for example Corporate QMS, or to Plant QMS in a flow with no Corporate step. Comes with the Audit maintenance application and cannot be changed.
    objects:
      InspectionTemplate: [read, view-all]
    abilities:
      - sheets.publish
      - sheets.retire
    fields:
      InspectionTemplate:
        read: [id, name, number, level, documentType, category, subCategory, partCode, planYear, retired, revision, lastRevisedAt, createdAt, updatedAt, ownerId,
                createdById, updatedById]
  - key: reader
    name: Reader
    description: Reads the templates published to them. Comes with the Audit maintenance application and cannot be changed.
    objects:
      InspectionTemplate: [read]
      InspectionChangeRequest: [read]
    fields:
      InspectionTemplate:
        read: [id, name, number, level, documentType, category, subCategory, partCode, planYear, retired, revision, lastRevisedAt, createdAt, updatedAt, ownerId,
                createdById, updatedById]
      InspectionChangeRequest:
        read: [id, name, templateId, status, createdAt, updatedAt, ownerId, createdById, updatedById]
  - key: filler
    name: Filler
    description: Fills in published templates. Comes with the Audit maintenance application and cannot be changed.
    objects:
      InspectionTemplate: [read]
      InspectionFill: [read, update]
      InspectionChangeRequest: [read]
    abilities:
      - sheets.fill
    fields:
      InspectionTemplate:
        read: [id, name, number, level, documentType, category, subCategory, partCode, planYear, retired, revision, lastRevisedAt, createdAt, updatedAt, ownerId,
                createdById, updatedById]
      InspectionFill:
        read: [id, name, templateId, status, createdAt, updatedAt, ownerId, createdById, updatedById]
      InspectionChangeRequest:
        read: [id, name, templateId, status, createdAt, updatedAt, ownerId, createdById, updatedById]
  - key: reviewer
    name: Reviewer
    description: Sees every fill-in. Whether a person reviews one is decided by the approval process. Comes with the Audit maintenance application and cannot be changed.
    objects:
      InspectionFill: [read, view-all]
    fields:
      InspectionFill:
        read: [id, name, templateId, status, createdAt, updatedAt, ownerId, createdById, updatedById]
  - key: departments
    name: Department setup
    description: Says which group of people belongs to which department of which location. Comes with the Audit maintenance application and cannot be changed.
    objects:
      DepartmentGroup: [create, read, update, delete]
    fields:
      DepartmentGroup:
        edit: [name, location, department, groupId]
        read: [createdAt, updatedAt, ownerId, createdById, updatedById]
