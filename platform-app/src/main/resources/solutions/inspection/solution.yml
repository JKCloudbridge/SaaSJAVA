# The Quality Management System solution, key inspection (Functional track, ADR-0175, ADR-0179, ADR-0180, ADR-0181).
#
# A shipped solution is read-only data inside the platform: an organization sees it only while its plan has the feature
# and can neither change nor remove any part of it. The application below is computed for every request and written to
# no table of the organization. The access policies are made as rows in each organization that has the feature, marked as
# shipped (so an administrator can assign them but not change them), the way the system profiles are made.
#
# The rights of the policies (FA4, ADR-0189): the rights on the objects and the abilities that go with each job. Authoring
# is the ordinary right to change a template; passing the lock of an approval is an ability of the Approver, and publishing
# and retiring are abilities of the Publisher, a policy apart so that an administrator decides which group has the last word
# (a template is never given a delete right: its records are kept). Licence, access policy and plan feature stay three
# mechanisms: these policies are not bound to a licence, and the plan feature decides whether any of this exists.
key: inspection
feature: inspection
label: Quality Management System
# The part each object plays in this application's functions (FA13B, ADR-0226). The code that carries the functions asks
# these lines which objects an application means and names none; Document Management repeats them because it shows the
# same records. Another application of the kind writes its own three lines.
roles:
  template: InspectionTemplate
  fill: InspectionFill
  changeRequest: InspectionChangeRequest
removalNote: >-
  Taking this feature away hides the Quality Management System application and its objects from the organization at once.
  Nothing is deleted: the records, approvals in flight and access policies stay, and everything comes back when the
  feature is given again.
# Only the words people read changed in FA9 (ADR-0203): the API name, the page keys and the feature key are permanent.
# Home is the dashboard everyone who can open the application sees; Management Review and Internal Audit are announced
# and have no page yet.
application:
  apiName: inspection
  label: Quality Management System
  iconKey: clipboard
  group: Leadership
  entries:
    - type: PLATFORM
      label: Home
      pageKey: home
      readsObject: InspectionTemplate
    - type: PLATFORM
      label: Document Control
      pageKey: templates
      readsObject: InspectionTemplate
    - type: PLATFORM
      label: Change requests
      pageKey: change-requests
      readsObject: InspectionChangeRequest
    - type: PLATFORM
      label: Record Control
      pageKey: fill-ins
      readsObject: InspectionFill
    - type: PLATFORM
      label: Report
      pageKey: fill-in-report
      readsObject: InspectionFill
    - type: PLATFORM
      label: Management Review
      pageKey: management-review
      placeholder: true
    - type: PLATFORM
      label: Internal Audit
      pageKey: internal-audit
      placeholder: true
    - type: OBJECT
      object: DepartmentGroup
objects:
  - InspectionTemplate
  - InspectionFill
  - InspectionChangeRequest
  - DepartmentGroup
# The records of these objects own a sheet: the grid of the template, kept in versions (FA3, ADR-0186).
sheetOwners:
  - InspectionTemplate
# The access policies below also exist while the Document Management application is on (FA13A, ADR-0225): that
# application shows the same documents, so the same people need the same rights. Each policy says so with
# alsoAvailableWith; a policy is never made twice.
accessPolicies:
  - key: author
    name: Author
    description: Writes templates and sends them for approval. Comes with the Quality Management System application and cannot be changed.
    alsoAvailableWith: [document-management, management-core]
    objects:
      InspectionTemplate: [create, read, update]
      InspectionChangeRequest: [read]
    fields:
      InspectionTemplate:
        edit: [name, level, documentType]
        read: [id, category, partA, partB, number, retired, revision, lastRevisedAt, application, createdAt, updatedAt, ownerId,
                createdById, updatedById]
      InspectionChangeRequest:
        read: [id, name, templateId, status, application, createdAt, updatedAt, ownerId, createdById, updatedById]
  - key: approver
    name: Approver
    description: Sees every template and change request, and changes a template that is in review. Does not publish or retire; that is the Publisher policy. Comes with the Quality Management System application and cannot be changed.
    alsoAvailableWith: [document-management, management-core]
    objects:
      InspectionTemplate: [read, update, view-all, modify-all]
      InspectionFill: [read, update, view-all, modify-all]
      InspectionChangeRequest: [read, update, view-all, modify-all]
    abilities:
      - approvals.override-lock
      - field-values.add
    fields:
      InspectionTemplate:
        edit: [name, level, documentType, category, partA, partB, serial]
        read: [id, number, retired, revision, lastRevisedAt, application, createdAt, updatedAt, ownerId, createdById, updatedById]
      InspectionFill:
        read: [id, name, templateId, status, application, plant, period, score, result, parentFill, createdAt, updatedAt, ownerId, createdById, updatedById]
      InspectionChangeRequest:
        read: [id, name, templateId, status, application, createdAt, updatedAt, ownerId, createdById, updatedById]
  - key: publisher
    name: Publisher
    description: Publishes an approved template to departments, takes it back and retires it. Give it to the group that has the last word, for example Corporate QMS, or to Plant QMS in a flow with no Corporate step. Comes with the Quality Management System application and cannot be changed.
    alsoAvailableWith: [document-management, management-core]
    objects:
      InspectionTemplate: [read, view-all]
    abilities:
      - sheets.publish
      - sheets.retire
    fields:
      InspectionTemplate:
        read: [id, name, number, level, documentType, category, partA, partB, retired, revision, lastRevisedAt, application, createdAt, updatedAt, ownerId,
                createdById, updatedById]
  - key: reader
    name: Reader
    description: Reads the templates published to them and the fill-ins shared with them, such as a fill-in they are asked to review. Comes with the Quality Management System application and cannot be changed.
    alsoAvailableWith: [document-management, management-core]
    # 2026-11-17: fill-ins are private, so reading them reaches only those shared with the person: a reviewer chosen
    # for a plant is given a read share of each fill-in they are asked to review, and needs this right to open it.
    objects:
      InspectionTemplate: [read]
      InspectionFill: [read]
      InspectionChangeRequest: [read]
    fields:
      InspectionTemplate:
        read: [id, name, number, level, documentType, category, partA, partB, retired, revision, lastRevisedAt, application, createdAt, updatedAt, ownerId,
                createdById, updatedById]
      InspectionFill:
        read: [id, name, templateId, status, application, plant, period, score, result, parentFill, createdAt, updatedAt, ownerId, createdById, updatedById]
      InspectionChangeRequest:
        read: [id, name, templateId, status, application, createdAt, updatedAt, ownerId, createdById, updatedById]
  - key: filler
    name: Filler
    description: Fills in published templates. Comes with the Quality Management System application and cannot be changed.
    alsoAvailableWith: [document-management, management-core]
    objects:
      InspectionTemplate: [read]
      InspectionFill: [read, update]
      InspectionChangeRequest: [read]
    abilities:
      - sheets.fill
    fields:
      InspectionTemplate:
        read: [id, name, number, level, documentType, category, partA, partB, retired, revision, lastRevisedAt, application, createdAt, updatedAt, ownerId,
                createdById, updatedById]
      InspectionFill:
        read: [id, name, templateId, status, application, plant, period, score, result, parentFill, createdAt, updatedAt, ownerId, createdById, updatedById]
      InspectionChangeRequest:
        read: [id, name, templateId, status, application, createdAt, updatedAt, ownerId, createdById, updatedById]
  - key: reviewer
    name: Reviewer
    description: Sees every fill-in. Whether a person reviews one is decided by the approval process. Comes with the Quality Management System application and cannot be changed.
    alsoAvailableWith: [document-management, management-core]
    objects:
      InspectionFill: [read, view-all]
    fields:
      InspectionFill:
        read: [id, name, templateId, status, application, plant, period, score, result, parentFill, createdAt, updatedAt, ownerId, createdById, updatedById]
  - key: departments
    name: Department setup
    description: Says which group of people belongs to which department of which location. Comes with the Quality Management System application and cannot be changed.
    alsoAvailableWith: [document-management, environment-management, management-core]
    objects:
      DepartmentGroup: [create, read, update, delete]
    fields:
      DepartmentGroup:
        edit: [name, location, department, groupId]
        read: [createdAt, updatedAt, ownerId, createdById, updatedById]
  # MC1.1, ADR-0259: for top management. It sees every document, fill-in and change request of every application and
  # changes nothing: no right to create or update, no field to edit, no ability. Documents are fixed private, so the
  # role hierarchy gives no sight of them; this policy, given to a group, does.
  - key: observer
    name: Observer
    description: Sees every template, fill-in and change request and changes nothing. Meant for top management. Comes with the Quality Management System application and cannot be changed.
    alsoAvailableWith: [document-management, management-core]
    objects:
      InspectionTemplate: [read, view-all]
      InspectionFill: [read, view-all]
      InspectionChangeRequest: [read, view-all]
    fields:
      InspectionTemplate:
        read: [id, name, number, level, documentType, category, partA, partB, retired, revision, lastRevisedAt, application, createdAt, updatedAt, ownerId,
                createdById, updatedById]
      InspectionFill:
        read: [id, name, templateId, status, application, plant, period, score, result, parentFill, createdAt, updatedAt, ownerId, createdById, updatedById]
      InspectionChangeRequest:
        read: [id, name, templateId, status, application, createdAt, updatedAt, ownerId, createdById, updatedById]
