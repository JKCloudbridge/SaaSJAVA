# The numbers of the Management Core solution (MC1, ADR-0257). One series numbers the forms of the application.
#
# The series draws its counters from the series `document` of the Quality Management System bundle (`counterSeries`),
# which Document Management numbers from too: one counter for each combination, so a form made here and a document made
# there can never get the same number, and a count goes on from the last number whoever took it. Only the counters are
# shared; the patterns below are this application's own (an organization sets them in Setup, Numbering) and the numbers
# are kept unique in each application's own template object. The format language is closed: fixed text, {field:name}
# and exactly one {seq:N} (no clock, no arithmetic, no code).
series:
  - key: management-document
    counterSeries: document
    object: ManagementTemplate
    field: number
    selector: category
    defaults:
      format: "{field:category}/{field:partB}/{seq:1}"
      withoutOptional: "{field:category}/{seq:1}"
      optionalField: partB
    formats:
      IMS: "IMS/{seq:2}"
      QSP: "QSP-{seq:2}"
      CORPQSP: "CORP-QSP-{seq:2}"
      ESSP: "ESSP-{seq:2}"
      WI: "WI/{field:partA}/{seq:2}"
      SOP: "SOP/{field:partA}/{seq:2}"
      F: "F/{field:partA}/{seq:2}"
      FEHS: "F/EHS/{field:partA}/{seq:2}"
      CSF: "CSF/{field:partA}/{seq:2}"
      PPT: "PPT/{field:partA}/{seq:2}"
      L: "L/{field:partA}/{seq:2}"
      LEHS: "L/EHS/{field:partA}/{seq:2}"
      R: "R/{field:partA}/{seq:2}"
      REHS: "R/EHS/{field:partA}/{seq:2}"
      EHSAIR: "EHS/AIR/{field:partA}/{seq:2}"
      EHSHIR: "EHS/HIR/{field:partA}/{seq:2}"
      EHSAID: "EHS/AID/{field:partA}/{seq:2}"
      EHSHID: "EHS/HID/{field:partA}/{seq:2}"
      EHSAHID: "EHS/AHID/{field:partA}/{seq:2}"
      PLEHS: "PL/EHS/{field:partA}/{seq:2}"
      EHSEMP: "EHS/EMP/{seq:2}"
      EHSOCP: "EHS/OCP/{seq:2}"
      CP: "CP/{field:partA}/{field:partB}"
      PFC: "PFC/{field:partA}/{field:partB}"
      FMEA: "FMEA/{field:partA}/{field:partB}"
      BP: "BP/{field:partB}"
