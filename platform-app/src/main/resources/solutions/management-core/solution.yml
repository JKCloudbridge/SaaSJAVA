# The Management Core solution, key management-core (Functional track, Management Core, MC1 and MC1.1, ADR-0257, ADR-0259).
#
# Management Core makes no documents of its own. Every document of every application is made in Document Management; the
# number Plant QMS gives it decides which application it also belongs to. An organization says in Setup, Numbering,
# Application routing, which combination of Identification and Part A belongs to which application (for example F with
# Part A MC belongs to Management Core). The platform then writes the application on the document, once, when the number
# is made, and a document with no matching rule belongs to Document Management alone.
#
# This application is therefore a view of the very same records that Document Management shows (it `uses` the same four
# objects and names the same parts), narrowed to the documents, fill-ins and change requests that carry its name. The
# narrowing chooses; it never grants: who may read a record is still the record store's and the decision API's answer.
# It has no New document button, because documents are made in Document Management. The access policies are Document
# Management's, made available with this application by their own files (`alsoAvailableWith`).
#
# What is particular to this application, all of it data:
#   * routedByNumber: its documents come from Document Management and are chosen by the number (above);
#   * footerDate: the footer of a document that belongs to this application carries the day the Revision was published,
#     wherever the document is shown (the option follows the document, not the screen);
#   * publishTo and publishDepartment (MC2A, ADR-0260): the creator of a document of this application publishes it to
#     the plants: each plant is a location that has a group of plant heads (the fixed department), and the creator
#     chooses the reviewers of each plant. The publish of Document Management is not changed by them;
#   * monthlyFillIn (MC2A, ADR-0260): a plant head starts one fill-in each month for their plant; the fill-in carries the
#     plant and the month, and one exists for a document, a plant and a month. The reviewers of a fill-in are the ones
#     the creator chose for its plant (the approver rule PUBLICATION_REVIEWERS in the fill-in's approval process).
key: management-core
feature: management-core
label: Management Core
removalNote: >-
  Taking this feature away hides the Management Core application from the organization at once. Nothing is deleted:
  the documents are Document Management's records, the routing rules and everything else stay, and the application comes
  back when the feature is given again.
order: 5
uses:
  - InspectionTemplate
  - InspectionFill
  - InspectionChangeRequest
  - DepartmentGroup
roles:
  template: InspectionTemplate
  fill: InspectionFill
  changeRequest: InspectionChangeRequest
options:
  routedByNumber: "true"
  footerDate: "true"
  monthlyFillIn: "true"
  publishTo: places
  publishDepartment: PLANTHEAD
# MC2B, ADR-0261: what an organization may change for this application in Setup, Application settings. The value here
# is the default, so the application works with no setup. scoreLimit is the percent below which a fill-in whose sheet
# marks a score needs an Action plan; a score equal to it needs none.
settings:
  - key: scoreLimit
    label: Score limit
    description: A fill-in whose score is below this whole percent needs an Action plan. A score equal to it needs none.
    kind: PERCENT
    default: 85
application:
  apiName: management-core
  label: Management Core
  iconKey: chart
  group: Leadership
  entries:
    - type: PLATFORM
      label: Home
      pageKey: home
      readsObject: InspectionTemplate
    - type: PLATFORM
      label: Document Control
      pageKey: templates
      readsObject: InspectionTemplate
    - type: PLATFORM
      label: Change requests
      pageKey: change-requests
      readsObject: InspectionChangeRequest
    - type: PLATFORM
      label: Record Control
      pageKey: fill-ins
      readsObject: InspectionFill
    - type: PLATFORM
      label: Report
      pageKey: fill-in-report
      readsObject: InspectionFill
    - type: PLATFORM
      label: KPI management
      pageKey: kpi-management
      placeholder: true
    - type: PLATFORM
      label: Management Review
      pageKey: management-review
      placeholder: true
    - type: PLATFORM
      label: Plantwise Review
      pageKey: plantwise-review
      placeholder: true
    - type: OBJECT
      object: DepartmentGroup
