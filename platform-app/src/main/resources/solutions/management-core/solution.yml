# The Management Core application (Functional track FA13A, ADR-0225): announced before it is built. Its tabs are announced.
# It brings no objects and no access policies, so there is nothing to read or to protect. It has a plan feature of its
# own, so an organization can have it with or without any other application. A tab becomes a real page later by
# changing only this file and registering its page in the web application.
key: management-core
feature: management-core
label: Management Core
removalNote: >-
  Taking this feature away hides the Management Core application from the organization at once. It holds no data, so nothing is lost,
  and it comes back when the feature is given again.
order: 5
application:
  apiName: management-core
  label: Management Core
  iconKey: chart
  group: Leadership
  entries:
    - type: PLATFORM
      label: Home
      pageKey: home
    - type: PLATFORM
      label: KPI management
      pageKey: kpi-management
      placeholder: true
    - type: PLATFORM
      label: Management Review
      pageKey: management-review
      placeholder: true
    - type: PLATFORM
      label: Plantwise Review
      pageKey: plantwise-review
      placeholder: true
