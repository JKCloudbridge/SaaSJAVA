# The Supplier Management application (Functional track FA13A, ADR-0225): announced before it is built. Its tabs are announced.
# It brings no objects and no access policies, so there is nothing to read or to protect. It has a plan feature of its
# own, so an organization can have it with or without any other application. A tab becomes a real page later by
# changing only this file and registering its page in the web application.
key: supplier-management
feature: supplier-management
label: Supplier Management
removalNote: >-
  Taking this feature away hides the Supplier Management application from the organization at once. It holds no data, so nothing is lost,
  and it comes back when the feature is given again.
order: 4
application:
  apiName: supplier-management
  label: Supplier Management
  iconKey: truck
  group: Supply chain
  entries:
    - type: PLATFORM
      label: Home
      pageKey: home
    - type: PLATFORM
      label: Supplier Performance Monitoring
      pageKey: supplier-performance-monitoring
      placeholder: true
    - type: PLATFORM
      label: Supplier Portal
      pageKey: supplier-portal
      placeholder: true
