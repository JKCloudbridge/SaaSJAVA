# The process applications (Functional track FA9, ADR-0203): the business's own functions, announced before they are
# built. Every application here is a placeholder: it opens on a generic Home that lists its tabs, and each tab says it
# is being prepared. A tab becomes a real page later by changing only this file (a page key or an object in place of
# the marker) and registering its page in the web application; nothing else moves.
#
# The bundle brings no objects and no access policies: a placeholder holds no data, so there is nothing to read or to
# protect. It has a plan feature of its own, so an organization can have these without the quality application
# and the other way round. Licence, access policy and plan feature stay three mechanisms.
key: processes
feature: process-applications
label: Process applications
removalNote: >-
  Taking this feature away hides the process applications from the organization at once. They hold no data, so nothing
  is lost, and they come back when the feature is given again.
