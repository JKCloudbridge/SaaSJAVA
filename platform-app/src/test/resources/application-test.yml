# Automated tests. The database settings are supplied by TestDatabaseInitializer (a real PostgreSQL container).
management:
  server:
    # A random port, so tests can reach the probes and metrics exactly as a deployment does.
    port: 0
  metrics:
    tags:
      environment: test
  tracing:
    sampling:
      probability: 1.0

logging:
  structured:
    format:
      # Plain text in tests unless a test turns structured output on to inspect it.
      console: ""

spring:
  mail:
    # The mail catcher container: no login, no encryption. TestDatabaseInitializer supplies the host and the port.
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
          # Short, so a test that pauses the mail server does not wait ten seconds for every attempt.
          connectiontimeout: 2000
          timeout: 3000
          writetimeout: 3000

platform:
  tenancy:
    base-domain: platform.example.test
  security:
    # Objects do not exist before Sprint 10: the tests (and the local profile) use two sample objects (ADR-0049).
    sample-objects:
      - key: object-a
        label: Object A
        fields:
          - { key: field-a, label: Field A }
          - { key: field-b, label: Field B }
          - { key: field-c, label: Field C }
      - key: object-b
        label: Object B
        fields:
          - { key: field-a, label: Field A }
  notification:
    # Tests drive the relay themselves (pollOnce), or switch it on for the one context that wants it to poll.
    enabled: false
    sender-address: no-reply@example.test
    public-base-url: http://localhost:3000
  outbox:
    # Tests drive the relay themselves, or switch it on for the one context that wants it to poll.
    enabled: false
  identity:
    # Tests come from made-up sources named in X-Forwarded-For, so that every test has its own rate-limit allowance.
    trust-forwarded-for: true
    cleanup:
      enabled: false
    password:
      # Cheap hashing keeps the suite fast; the tests of the hash itself build their own hasher with real parameters.
      memory-kib: 1024
      iterations: 1
    cookies:
      secure: false
    signing:
      ephemeral: true
