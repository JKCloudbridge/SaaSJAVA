# Automated tests. The database settings are supplied by TestDatabaseInitializer (a real PostgreSQL container).
management:
  server:
    # A random port, so tests can reach the probes and metrics exactly as a deployment does.
    port: 0
  metrics:
    tags:
      environment: test
  tracing:
    sampling:
      probability: 1.0
    export:
      # Unconditionally off: a test run must never depend on, or be slowed by, a collector that is not there,
      # whatever PLATFORM_TRACE_EXPORT happens to be set to in the shell that started it.
      otlp:
        enabled: false

logging:
  structured:
    format:
      # Plain text in tests unless a test turns structured output on to inspect it.
      console: ""

spring:
  mail:
    # The mail catcher container: no login, no encryption. TestDatabaseInitializer supplies the host and the port.
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
          # Short, so a test that pauses the mail server does not wait ten seconds for every attempt.
          connectiontimeout: 2000
          timeout: 3000
          writetimeout: 3000

platform:
  tenancy:
    base-domain: platform.example.test
    # The limits of one organization are far out of the way, so that tests that run many requests at once are not
    # refused; the tests of the limits themselves set small numbers.
    limits:
      max-concurrent: 1000
      max-waiting: 1000
      query-timeout: 60s
      write-timeout: 120s
  notification:
    # Tests drive the relay themselves (pollOnce), or switch it on for the one context that wants it to poll.
    enabled: false
    sender-address: no-reply@example.test
    public-base-url: http://localhost:3000
    notices:
      retention:
        # Tests drive the clean-up of notices themselves (runOnce), or switch it on for the one context that wants it.
        enabled: false
  approval:
    timer:
      # Tests drive the timer of reminders themselves (pollOnce), or switch it on for the one context that wants it.
      enabled: false
  licensing:
    trial:
      # Tests drive the end of a trial themselves (runOnce), or switch it on for the one context that wants it.
      enabled: false
  outbox:
    # Tests drive the relay themselves, or switch it on for the one context that wants it to poll.
    enabled: false
  workflow:
    # Tests drive the dispatcher themselves (pollExecutionsOnce, pollSchedulesOnce), or switch it on for the one
    # context that wants it to run by itself.
    enabled: false
  storage:
    # Short, so a test that pauses the store does not wait a minute for every attempt.
    socket-timeout: 2s
    call-timeout: 6s
  data:
    # Tests drive the clean-up of files and the runner of imports themselves (runOnce, workOn), or switch them on for
    # the one context that wants them to run by themselves.
    files:
      # Small, so that a test of the largest size sends kilobytes and not megabytes.
      max-bytes: 100000
      cleanup:
        enabled: false
    imports:
      enabled: false
  identity:
    # Tests come from made-up sources named in X-Forwarded-For, so that every test has its own rate-limit allowance.
    trust-forwarded-for: true
    cleanup:
      enabled: false
    password:
      # Cheap hashing keeps the suite fast; the tests of the hash itself build their own hasher with real parameters.
      memory-kib: 1024
      iterations: 1
    cookies:
      secure: false
    signing:
      ephemeral: true
