# Continuous integration. Every stage of the Definition of Done that can be automated runs here.
# Stages: build, unit tests, architecture tests, integration tests (real PostgreSQL in a container),
# static analysis, frontend (lint, types, tests, generated-client check, build, audit), dependency vulnerability
# scan, container image build with a database-backed smoke test and image scan.
name: CI

on:
  push:
    branches: [main, "M*S*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Compile everything and package the application. Enforcer rules run here.
      - name: Build
        run: ./mvnw -B -ntp -DskipTests package

      # Fast tests without containers.
      - name: Unit tests
        run: ./mvnw -B -ntp test -DexcludedGroups=architecture

      # Module boundaries. This stage fails the build on any illegal module dependency.
      - name: Architecture tests
        run: ./mvnw -B -ntp test -Dgroups=architecture

      # Integration tests start containers (PostgreSQL) through the runner's container daemon. They include the
      # contract check: the committed OpenAPI document must equal what the application generates.
      - name: Integration tests
        run: ./mvnw -B -ntp verify -Pintegration-only

      - name: Upload application jar
        uses: actions/upload-artifact@v7.0.1
        with:
          name: platform-app-jar
          path: platform-app/target/platform-app-*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Style checks and bug-pattern analysis (profile "quality"); compiler warnings are already errors.
      - name: Style and bug-pattern analysis
        run: ./mvnw -B -ntp -Pquality -DskipTests -DskipITs verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform-web
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: platform-web/.nvmrc
          cache: npm
          cache-dependency-path: platform-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Regenerates the TypeScript client from the committed OpenAPI document and fails when the committed
      # client differs: a contract change cannot be merged without its client, and the document itself is checked
      # against the running application by the integration tests above.
      - name: Generated API client is current
        run: npm run api:check

      # The published contract of the public API (Sprint 30) must produce a client that type-checks against a sample that
      # calls every operation: a document a generator cannot turn into a usable client fails the build.
      - name: Public API contract produces a usable client
        run: npm run api:public:check

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  dependency-scan:
    name: Dependency vulnerability scan
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: platform-app-jar
          path: scan

      # Scans the resolved dependency set inside the built jar (exactly what ships), failing on any
      # fixable HIGH or CRITICAL finding.
      - name: Scan dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: rootfs
          scan-ref: scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  container-image:
    name: Container image
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.1
        with:
          name: platform-app-jar
          path: platform-app/target

      # The release stamp (ADR-0287): the commit and the build time are shown by /actuator/info and in one log line at start.
      # Neither is a secret. The tag is the commit: an image is never tagged latest (ADR-0287).
      - name: Build image
        run: |
          docker build -t platform-app:${{ github.sha }} \
            --build-arg GIT_COMMIT=${{ github.sha }} --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" platform-app

      # Starts the image the way a deployment does: production profile, settings from environment variables, a real
      # database with two roles. The application role is created by the real manual migration M001 (run as the owner,
      # password set separately), so this proves the grants, default privileges and row level security work for the role
      # the image runs as. Readiness only turns UP when the migrations ran and the database answers; the status endpoint
      # proves the API port works; the tenant endpoint proves host-name resolution on the image (an open organization,
      # an unknown one, a closed one). The database passwords are random and live only for this job.
      # Sprint 3 adds Redis (rate limits shared across instances) and a token signing key pair, both generated here and
      # kept only for this job. The authentication checks (scripts/ci-smoke-auth.sh) prove that the image refuses an
      # unauthenticated call, answers the sign-in uniformly, publishes only the public key, keeps its cookies secure,
      # writes the audit record and really uses Redis. Sprint 4 adds a mail catcher (SMTP) and the sender and public
      # address settings; the same script then runs a whole sign-up on the image and reads the e-mail from the catcher.
      # Sprint 17 adds an object store (the image has no default bucket or credentials, like every deployment): the script then
      # stores and fetches a file, runs a bulk call, an import and a search on the image.
      - name: Smoke test image
        run: |
          owner_password="$(openssl rand -hex 16)"
          app_password="$(openssl rand -hex 16)"
          redis_password="$(openssl rand -hex 16)"
          keys="$(mktemp -d)"
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$keys/private.pem"
          openssl pkey -in "$keys/private.pem" -pubout -out "$keys/public.pem"
          chmod 755 "$keys"
          chmod 644 "$keys"/*.pem
          docker network create smoke
          docker run -d --name smoke-redis --network smoke \
            redis:8 redis-server --requirepass "$redis_password"
          docker run -d --name smoke-mail --network smoke -p 8025:8025 axllent/mailpit:v1.31
          store_key="$(openssl rand -hex 8)"
          store_secret="$(openssl rand -hex 16)"
          docker run -d --name smoke-store --network smoke -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID="$store_key" -e AWS_SECRET_ACCESS_KEY="$store_secret" \
            chrislusf/seaweedfs:4.48 server -s3 -dir=/data -master.volumeSizeLimitMB=128
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8333/status >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" --user "$store_key:$store_secret" \
            http://localhost:8333/smoke-files
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_USER=platform_owner -e POSTGRES_PASSWORD="$owner_password" -e POSTGRES_DB=platform \
            postgres:18
          for _ in $(seq 1 30); do
            if docker exec smoke-db pg_isready -U platform_owner -d platform; then break; fi
            sleep 2
          done
          docker exec -i smoke-db psql -U platform_owner -d platform -v ON_ERROR_STOP=1 \
            < db/manual/M001__create_application_role.sql
          echo "alter role platform_app password '$app_password';" \
            | docker exec -i smoke-db psql -U platform_owner -d platform -v ON_ERROR_STOP=1
          docker run -d --name smoke --network smoke -p 8080:8080 -p 8081:8081 \
            -e PLATFORM_DB_URL=jdbc:postgresql://smoke-db:5432/platform \
            -e PLATFORM_DB_OWNER_USER=platform_owner -e PLATFORM_DB_OWNER_PASSWORD="$owner_password" \
            -e PLATFORM_DB_APP_USER=platform_app -e PLATFORM_DB_APP_PASSWORD="$app_password" \
            -e PLATFORM_BASE_DOMAIN=platform.example.test \
            -e PLATFORM_REDIS_HOST=smoke-redis -e PLATFORM_REDIS_PASSWORD="$redis_password" \
            -e PLATFORM_SMTP_HOST=smoke-mail -e PLATFORM_SMTP_PORT=1025 -e PLATFORM_SMTP_AUTH=false \
            -e PLATFORM_SMTP_STARTTLS_REQUIRED=false \
            -e PLATFORM_MAIL_SENDER=no-reply@example.test -e PLATFORM_PUBLIC_BASE_URL=https://platform.example.test \
            -e PLATFORM_STORAGE_ENDPOINT=http://smoke-store:8333 -e PLATFORM_STORAGE_PATH_STYLE=true \
            -e PLATFORM_STORAGE_BUCKET=smoke-files \
            -e PLATFORM_STORAGE_ACCESS_KEY="$store_key" -e PLATFORM_STORAGE_SECRET_KEY="$store_secret" \
            -e PLATFORM_SECRETS_KEK_ACTIVE_ID=ci-smoke-kek \
            -e PLATFORM_SECRETS_KEK_ACTIVE_KEY="$(openssl rand -base64 32)" \
            -e PLATFORM_SIGNING_KEY_ID=ci-smoke-key \
            -e PLATFORM_SIGNING_PRIVATE_KEY_FILE=/keys/private.pem \
            -e PLATFORM_SIGNING_PUBLIC_KEY_FILE=/keys/public.pem \
            -v "$keys:/keys:ro" \
            platform-app:${{ github.sha }}
          for _ in $(seq 1 40); do
            if curl -fsS http://localhost:8081/actuator/health/readiness; then
              echo
              curl -fsS -H "X-Request-ID: ci-smoke-request-1" -i http://localhost:8080/api/v1/platform/status
              echo
              bash ./scripts/ci-smoke-tenants.sh smoke-db "$app_password"
              bash ./scripts/ci-smoke-auth.sh smoke-db smoke-redis "$redis_password" http://localhost:8025
              # Sprint 33: the migration job, the start without the right to migrate, a database that is behind, an orderly stop.
              bash ./scripts/ci-smoke-deploy.sh platform-app:${{ github.sha }} "$owner_password" "$app_password" \
                "$redis_password" "$store_key" "$store_secret" "$keys"
              exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: platform-app:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Publishing an image to a registry is done by the release procedure of the owner (docs/runbooks/deploy.md), never by CI:
      # CI holds no cloud credentials (Sprint 33, ADR-0292).

  # The web image (Sprint 33, ADR-0287): a production build in an image that runs as a user without rights, answers its health
  # check, holds no secret, and passes the scan like the application image. The build runs `next build` inside Docker.
  web-image:
    name: Web image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build image
        run: |
          docker build -t platform-web:${{ github.sha }} \
            --build-arg GIT_COMMIT=${{ github.sha }} --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" platform-web

      - name: Runs without rights, answers its health check, drains on a stop, holds no secret
        run: |
          user="$(docker run --rm --entrypoint id platform-web:${{ github.sha }} -u)"
          [ "$user" != "0" ] || { echo "the web image runs as root"; exit 1; }
          docker run -d --name web-check -e WEB_SHUTDOWN_DELAY=3 -p 3000:3000 platform-web:${{ github.sha }}
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz | grep -q '^ok$'; then ok=yes; break; fi
            sleep 1
          done
          [ -n "${ok:-}" ] || { docker logs web-check; exit 1; }
          docker kill --signal=TERM web-check
          sleep 1
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/healthz)" = "503" ] \
            || { echo "the health route did not turn to 503 when the stop began"; exit 1; }
          for _ in $(seq 1 20); do
            if [ "$(docker inspect -f '{{.State.Running}}' web-check)" = "false" ]; then stopped=yes; break; fi
            sleep 1
          done
          [ -n "${stopped:-}" ] || { echo "the web server did not stop after its delay"; exit 1; }
          if docker run --rm --entrypoint sh platform-web:${{ github.sha }} -c 'env' | grep -Ei 'password|secret|token|key'; then
            echo "the web image's environment holds something shaped like a secret"
            exit 1
          fi
          docker rm web-check

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: platform-web:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # The edge sidecar (Sprint 33, ADR-0286): the rules file must be valid for the proxy that runs it, and the image is scanned.
  edge-image:
    name: Edge image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build image
        run: |
          docker build -t platform-edge:${{ github.sha }} \
            --build-arg GIT_COMMIT=${{ github.sha }} --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" deploy/edge

      - name: The configuration is valid and the image runs without rights
        run: |
          docker run --rm -e TRUSTED_CIDR=10.0.0.0/16 platform-edge:${{ github.sha }} \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          user="$(docker run --rm --entrypoint id platform-edge:${{ github.sha }} -u)"
          [ "$user" != "0" ] || { echo "the edge image runs as root"; exit 1; }

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: platform-edge:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # The infrastructure files (Sprint 33, ADR-0292): formatted, valid, and nothing applied. CI holds no cloud credentials, makes no
  # plan against a cloud and applies nothing; a plan is made and read by the owner. The rules about the numbers of a release, about
  # environments, about alerts and about secret-shaped text are unit tests of the build above.
  infrastructure:
    name: Infrastructure files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Format
        run: docker run --rm -v "$PWD/deploy/infra:/work" -w /work ghcr.io/opentofu/opentofu:1.10 fmt -check -recursive -diff

      - name: Validate (without a backend and without credentials)
        run: |
          for folder in stack bootstrap; do
            docker run --rm -v "$PWD/deploy/infra:/work" -w "/work/$folder" ghcr.io/opentofu/opentofu:1.10 init -backend=false -input=false
            docker run --rm -v "$PWD/deploy/infra:/work" -w "/work/$folder" ghcr.io/opentofu/opentofu:1.10 validate
          done
