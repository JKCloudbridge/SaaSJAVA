# Continuous integration. Every stage of the Definition of Done that can be automated runs here.
# Stages: build, unit tests, architecture tests, integration tests (real PostgreSQL in a container),
# static analysis, frontend (lint, types, tests, generated-client check, build, audit), dependency vulnerability
# scan, container image build with a database-backed smoke test and image scan.
name: CI

on:
  push:
    branches: [main, "M*S*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Compile everything and package the application. Enforcer rules run here.
      - name: Build
        run: ./mvnw -B -ntp -DskipTests package

      # Fast tests without containers.
      - name: Unit tests
        run: ./mvnw -B -ntp test -DexcludedGroups=architecture

      # Module boundaries. This stage fails the build on any illegal module dependency.
      - name: Architecture tests
        run: ./mvnw -B -ntp test -Dgroups=architecture

      # Integration tests start containers (PostgreSQL) through the runner's container daemon. They include the
      # contract check: the committed OpenAPI document must equal what the application generates.
      - name: Integration tests
        run: ./mvnw -B -ntp verify -Pintegration-only

      - name: Upload application jar
        uses: actions/upload-artifact@v7.0.1
        with:
          name: platform-app-jar
          path: platform-app/target/platform-app-*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Style checks and bug-pattern analysis (profile "quality"); compiler warnings are already errors.
      - name: Style and bug-pattern analysis
        run: ./mvnw -B -ntp -Pquality -DskipTests -DskipITs verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform-web
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: platform-web/.nvmrc
          cache: npm
          cache-dependency-path: platform-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Regenerates the TypeScript client from the committed OpenAPI document and fails when the committed
      # client differs: a contract change cannot be merged without its client, and the document itself is checked
      # against the running application by the integration tests above.
      - name: Generated API client is current
        run: npm run api:check

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  dependency-scan:
    name: Dependency vulnerability scan
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: platform-app-jar
          path: scan

      # Scans the resolved dependency set inside the built jar (exactly what ships), failing on any
      # fixable HIGH or CRITICAL finding.
      - name: Scan dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: rootfs
          scan-ref: scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  container-image:
    name: Container image
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.1
        with:
          name: platform-app-jar
          path: platform-app/target

      - name: Build image
        run: docker build -t platform-app:${{ github.sha }} platform-app

      # Starts the image the way a deployment does: production profile, settings from environment variables, a real
      # database. Readiness only turns UP when the migrations ran and the database answers, and the status
      # endpoint proves the API port works. The database passwords are random and live only for this job.
      - name: Smoke test image
        run: |
          owner_password="$(openssl rand -hex 16)"
          app_password="$(openssl rand -hex 16)"
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_USER=platform_owner -e POSTGRES_PASSWORD="$owner_password" -e POSTGRES_DB=platform \
            postgres:18
          for _ in $(seq 1 30); do
            if docker exec smoke-db pg_isready -U platform_owner -d platform; then break; fi
            sleep 2
          done
          docker exec smoke-db psql -U platform_owner -d platform -v ON_ERROR_STOP=1 -c \
            "create role platform_app login password '$app_password' nosuperuser nocreatedb nocreaterole nobypassrls" \
            -c "grant connect on database platform to platform_app" -c "grant usage on schema public to platform_app"
          docker run -d --name smoke --network smoke -p 8080:8080 -p 8081:8081 \
            -e PLATFORM_DB_URL=jdbc:postgresql://smoke-db:5432/platform \
            -e PLATFORM_DB_OWNER_USER=platform_owner -e PLATFORM_DB_OWNER_PASSWORD="$owner_password" \
            -e PLATFORM_DB_APP_USER=platform_app -e PLATFORM_DB_APP_PASSWORD="$app_password" \
            platform-app:${{ github.sha }}
          for _ in $(seq 1 40); do
            if curl -fsS http://localhost:8081/actuator/health/readiness; then
              echo
              curl -fsS -H "X-Request-ID: ci-smoke-request-1" -i http://localhost:8080/api/v1/platform/status
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: platform-app:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Publishing the image to a registry is added with the deployment work (Sprint 33).
