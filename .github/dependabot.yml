version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    groups:
      spring:
        patterns:
          - "org.springframework*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/platform-app"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/platform-web"
    schedule:
      interval: weekly
    groups:
      next-and-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
      telemetry:
        patterns:
          - "@opentelemetry/*"
