# Production-like rehearsal on one machine (transition plan, step 1; Sprint 33, ADR-0286 to ADR-0291): the built images, the
# production profile, an ingress that behaves like the cloud load balancer, a migration job that runs first, and several
# application replicas that the scripts start, replace and stop the way a deployment does.
# Usage and what it proves: README.md in this folder. Start it with ./up.ps1 (not with `docker compose up`).
#
# This file holds the fixed part: the data services, the one-shot steps, the migration job and the ingress. The application
# replicas (each an application container with its edge sidecar beside it, as in a task) and the web replicas are started by
# the scripts, because releasing, rolling back and scaling them is the point.
#
# Everything is separate from infra/local (own project name, own network, own volumes); only the ingress publishes the
# standard ports, and only on 127.0.0.1. Credentials come from .env and the keys from secrets/, both made by init.ps1 (and
# both ignored by git).
name: platform-rehearsal

networks:
  default:
    # A fixed range, so the edge sidecars can be told which addresses are the trusted hop (the ingress), as they are told the
    # network of the load balancer in a deployment.
    name: platform-rehearsal
    ipam:
      config:
        - subnet: 172.31.77.0/24

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run init.ps1 first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run init.ps1 first}
      POSTGRES_DB: ${POSTGRES_DB:?run init.ps1 first}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run init.ps1 first}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  object-storage:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-s3", "-dir=/data", "-master.volumeSizeLimitMB=128"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?run init.ps1 first}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?run init.ps1 first}
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8333/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The real environment sends mail through a provider with a login; the rehearsal catches it (http://localhost:8026), the way
  # staging does.
  mail-catcher:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:8026:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-time steps a deployment does before the first start: the application role (manual migration M001, run as the owner)
  # and the bucket. Run by up.ps1, before the migration job.
  role-init:
    image: postgres:18
    profiles: ["jobs"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - ../../db/manual/M001__create_application_role.sql:/m001.sql:ro
    entrypoint: ["sh", "-c"]
    command:
      - >
        psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -v ON_ERROR_STOP=1 -f /m001.sql &&
        psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -v ON_ERROR_STOP=1
        -c "alter role platform_app password '$$APP_DB_PASSWORD'"

  bucket-init:
    image: amazon/aws-cli:latest
    profiles: ["jobs"]
    depends_on:
      object-storage:
        condition: service_healthy
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command: ["aws --endpoint-url http://object-storage:8333 s3 mb s3://platform-files || true"]

  # The migration job (ADR-0288): the application image's `migrate` command, as the owner, before any replica starts. It needs
  # three values and nothing else. A release runs it with the NEW image (MIGRATE_IMAGE) before it replaces a replica.
  migrate:
    image: ${MIGRATE_IMAGE:-platform-app:local}
    profiles: ["jobs"]
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PLATFORM_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      PLATFORM_DB_OWNER_USER: ${POSTGRES_USER}
      PLATFORM_DB_OWNER_PASSWORD: ${POSTGRES_PASSWORD}

  # The load balancer of the rehearsal: https with the rehearsal's own certificate authority, the host preserved, http sent to
  # https, the management port never routed, and (like a cloud balancer, and unlike a proxy that overwrites) X-Forwarded-For
  # APPENDED to and a client's X-Forwarded-Host passed through. The application and its sidecar have to cope with that.
  ingress:
    image: caddy:2
    networks:
      default:
        ipv4_address: 172.31.77.250
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ingress-data:/data

volumes:
  postgres-data:
  object-storage-data:
  ingress-data:
