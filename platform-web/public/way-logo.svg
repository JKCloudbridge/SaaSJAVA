<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 0 740 744" role="img" aria-label="WAY logo"><style>
.disc,.badge{transform-box:fill-box;transform-origin:center}
.disc{animation:pop .6s cubic-bezier(.2,.9,.3,1.15) both}
.reveal{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.05s .55s cubic-bezier(.65,.05,.3,1) forwards}
.badge{animation:pop .5s 1.55s cubic-bezier(.2,.9,.3,1.35) both}
.lt{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .45s ease-out forwards}
.l1{animation-delay:1.95s}.l2{animation-delay:2.2s}.l3{animation-delay:2.45s}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.glow{animation:sweep 3.6s 3.2s ease-in-out infinite backwards}
.vwrap{animation:pulse 3.6s 3.2s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(0)}70%,100%{transform:translateX(1300px)}}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 0 rgba(200,120,220,0))}35%{filter:drop-shadow(0 0 14px rgba(200,120,220,.55))}70%{filter:drop-shadow(0 0 0 rgba(200,120,220,0))}}
@media (prefers-reduced-motion:reduce){.disc,.badge,.reveal,.lt,.glow,.vwrap{animation:none}.reveal,.lt{stroke-dashoffset:0}.glow{display:none}}
</style><defs><linearGradient id="gv" gradientUnits="userSpaceOnUse" x1="190" y1="220" x2="600" y2="660"><stop offset="0" stop-color="#92408b"/><stop offset=".5" stop-color="#9d5c96"/><stop offset="1" stop-color="#b681af"/></linearGradient><linearGradient id="gb" gradientUnits="userSpaceOnUse" x1="653" y1="187" x2="653" y2="418"><stop offset="0" stop-color="#9a3262"/><stop offset="1" stop-color="#c0809a"/></linearGradient><mask id="vmask" maskUnits="userSpaceOnUse" x="0" y="0" width="936" height="776"><path class="reveal" pathLength="1" d="M250 260 L470 600 Q545 645 640 485" fill="none" stroke="#fff" stroke-width="340" stroke-linecap="round" stroke-linejoin="round"/></mask><clipPath id="vclip"><path d="M253.0 206.5 Q169.0 207.0 167.0 211.5 Q165.0 216.0 292.5 433.0 Q420.0 650.0 434.5 663.0 Q449.0 676.0 469.5 682.5 Q490.0 689.0 508.0 686.5 Q526.0 684.0 542.0 673.5 Q558.0 663.0 569.0 649.5 Q580.0 636.0 615.0 576.0 Q650.0 516.0 688.0 462.0 Q662.0 488.0 627.0 497.0 Q598.0 501.0 586.5 497.5 Q575.0 494.0 561.5 486.0 Q548.0 478.0 533.0 459.5 Q518.0 441.0 464.0 345.5 Q410.0 250.0 403.5 242.0 Q397.0 234.0 385.5 225.5 Q374.0 217.0 355.5 211.5 Q337.0 206.0 253.0 206.5Z"/></clipPath><linearGradient id="gg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><circle class="disc" cx="450.0" cy="372.6" r="363.9" fill="#fff"/><g class="vwrap"><g mask="url(#vmask)"><path class="v" fill="url(#gv)" d="M253.0 206.5 Q169.0 207.0 167.0 211.5 Q165.0 216.0 292.5 433.0 Q420.0 650.0 434.5 663.0 Q449.0 676.0 469.5 682.5 Q490.0 689.0 508.0 686.5 Q526.0 684.0 542.0 673.5 Q558.0 663.0 569.0 649.5 Q580.0 636.0 615.0 576.0 Q650.0 516.0 688.0 462.0 Q662.0 488.0 627.0 497.0 Q598.0 501.0 586.5 497.5 Q575.0 494.0 561.5 486.0 Q548.0 478.0 533.0 459.5 Q518.0 441.0 464.0 345.5 Q410.0 250.0 403.5 242.0 Q397.0 234.0 385.5 225.5 Q374.0 217.0 355.5 21